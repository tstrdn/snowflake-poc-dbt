name: Deploy

# Reusable deployment of one immutable artifact version to one environment.
#
# Development runs this automatically after a release; test and production run
# it through promote.yml behind a two-role approval (E17/E18 - see
# promote.yml). The steps are identical in every case - only the target
# account and the gate differ. There is no per-environment version file
# committed back to this repository: what is deployed is answered by which
# tag was checked out, by the checksum verified below, and by the version
# stamped onto the DBT PROJECT object itself at the end of this job (E5/E6,
# applied here by the same reasoning used for the infrastructure repository).

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev, tst or prd)
        required: true
        type: string
      version:
        description: Artifact version to deploy
        required: true
        type: string

permissions:
  contents: read

env:
  # Must match the dbt-core that resolved package-lock.yml in the artifact.
  DBT_VERSION: "1.11.11"

jobs:
  deploy:
    name: Deploy ${{ inputs.version }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    concurrency:
      # Snowflake refuses concurrent EXECUTE DBT PROJECT against the same
      # project object, so deployments to one environment must queue.
      group: dbt-deploy-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      # The immutable tag, not a moving branch. What is deployed is the tree
      # at this exact tag, every time it is deployed - this repository's
      # workflow scripts cannot drift out from under an artifact that was
      # already built and checksummed against an earlier state of main.
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/v${{ inputs.version }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          # Without this, setup-python looks for requirements.txt or
          # pyproject.toml, finds neither, and fails before installing anything.
          cache-dependency-path: requirements-snow.txt

      - name: Install the Snowflake CLI
        run: pip install --quiet -r requirements-snow.txt

      - uses: jfrog/setup-jfrog-cli@v5
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Download the artifact
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The trailing * matters: without it, jf rt download resolved the
          # directory to a single match and silently fetched only the .tgz,
          # never the .tgz.sha256 next to it - confirmed from run 32245121363,
          # where the checksum step failed on a missing file rather than a
          # mismatch. The wildcard makes it enumerate everything under the
          # version directory.
          jf rt download \
            "snowflake-poc-dbt-artifacts/jaffle-shop/${VERSION}/*" \
            artifact/ --flat --fail-no-op

          ls -l artifact/

      # The point of the whole design. If this check ever fails, the thing
      # about to reach production is not the thing that was tested.
      - name: Verify the checksum
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd artifact

          expected=$(cut -d' ' -f1 < "snowflake-poc-dbt-${VERSION}.tgz.sha256")
          actual=$(sha256sum "snowflake-poc-dbt-${VERSION}.tgz" | cut -d' ' -f1)

          echo "expected ${expected}"
          echo "actual   ${actual}"

          if [ "$expected" != "$actual" ]; then
            echo "::error::Checksum mismatch. The artifact was altered in transit or in storage."
            exit 1
          fi

          echo "ARTIFACT_SHA256=${actual}" >> "$GITHUB_ENV"

      - name: Unpack
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p project
          tar --extract --gzip --file "artifact/snowflake-poc-dbt-${VERSION}.tgz" --directory project
          ls -1 project/

      - name: Write the private key
        env:
          SF_PRIVATE_KEY: ${{ secrets.SF_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$SF_PRIVATE_KEY" > /tmp/sf_key.p8
          openssl pkey -in /tmp/sf_key.p8 -noout

      - name: Deploy the project object
        env:
          SF_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
          SF_USER: ${{ secrets.SF_USER }}
          TARGET: ${{ inputs.environment }}
        run: |
          cd project
          snow dbt deploy JAFFLE_SHOP \
            --source . \
            --profiles-dir . \
            --default-target "$TARGET" \
            --dbt-version "$DBT_VERSION" \
            --temporary-connection \
            --account "$SF_ACCOUNT" \
            --user "$SF_USER" \
            --private-key-file /tmp/sf_key.p8 \
            --authenticator SNOWFLAKE_JWT \
            --role TRANSFORMER \
            --warehouse WH_TRANSFORM_XS \
            --database OPS \
            --schema DBT_PROJECTS

      - name: Run the project
        env:
          SF_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
          SF_USER: ${{ secrets.SF_USER }}
          TARGET: ${{ inputs.environment }}
        run: |
          cd project
          # Connection options must precede the project name - anything after
          # the dbt command is forwarded to dbt rather than read by snow.
          snow dbt execute \
            --temporary-connection \
            --account "$SF_ACCOUNT" \
            --user "$SF_USER" \
            --private-key-file /tmp/sf_key.p8 \
            --authenticator SNOWFLAKE_JWT \
            --role TRANSFORMER \
            --warehouse WH_TRANSFORM_XS \
            --database OPS \
            --schema DBT_PROJECTS \
            JAFFLE_SHOP build --target "$TARGET"

      # E6, applied to this track: the deployed version becomes queryable
      # directly from Snowflake (DESCRIBE DBT PROJECT OPS.DBT_PROJECTS.
      # JAFFLE_SHOP) instead of only from a version file that a workflow used
      # to commit back to main. ALTER DBT PROJECT ... SET COMMENT is
      # documented at
      # https://docs.snowflake.com/en/sql-reference/sql/alter-dbt-project.
      # Non-fatal on failure: a stamping problem should not undo a deployment
      # that otherwise succeeded, but it must be visible, not silent.
      - name: Stamp the deployed version
        if: always()
        env:
          SF_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
          SF_USER: ${{ secrets.SF_USER }}
          VERSION: ${{ inputs.version }}
        run: |
          comment="v${VERSION} sha256=${ARTIFACT_SHA256:-unknown} deployed=$(date -u +%Y-%m-%dT%H:%M:%SZ) by=${GITHUB_ACTOR}"
          snow sql \
            --temporary-connection \
            --account "$SF_ACCOUNT" \
            --user "$SF_USER" \
            --private-key-file /tmp/sf_key.p8 \
            --authenticator SNOWFLAKE_JWT \
            --role TRANSFORMER \
            --warehouse WH_TRANSFORM_XS \
            --database OPS \
            --schema DBT_PROJECTS \
            -q "ALTER DBT PROJECT IF EXISTS OPS.DBT_PROJECTS.JAFFLE_SHOP SET COMMENT = '${comment}'" \
            || echo "::warning::Could not stamp the version comment onto the DBT PROJECT object. Deployment result above is unaffected."

      - name: Clean up the key
        if: always()
        run: rm -f /tmp/sf_key.p8

      - name: Summarise
        if: always()
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## ${ENVIRONMENT} — artifact v${VERSION}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | \`${ENVIRONMENT}\` |"
            echo "| Artifact version | \`${VERSION}\` |"
            echo "| SHA256 | \`${ARTIFACT_SHA256:-not verified}\` |"
            echo "| Result | ${{ job.status }} |"
            echo
            echo "What this environment is running can also be read directly from"
            echo "Snowflake: \`DESCRIBE DBT PROJECT OPS.DBT_PROJECTS.JAFFLE_SHOP\` shows"
            echo "the deployed version in the comment."
          } >> "$GITHUB_STEP_SUMMARY"
