version: 2

models:
  - name: stg_customers
    description: One row per customer, lightly renamed from the source.
    columns:
      - name: customer_id
        description: Primary key.
        data_tests:
          - unique
          - not_null

  - name: stg_orders
    description: One row per order.
    columns:
      - name: order_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to stg_customers.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: status
        description: Current fulfilment status of the order.
        data_tests:
          - accepted_values:
              values:
                ["placed", "shipped", "completed", "return_pending", "returned"]

  - name: stg_payments
    description: One row per payment. An order may be split across payments.
    columns:
      - name: payment_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: Foreign key to stg_orders.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: payment_method
        data_tests:
          - accepted_values:
              values: ["credit_card", "coupon", "bank_transfer", "gift_card"]
      - name: amount
        description: Payment amount in currency units, converted from cents.
        data_tests:
          - not_null
